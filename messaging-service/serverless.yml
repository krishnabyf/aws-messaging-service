service: messaging-service

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1

  environment:
    SES_EMAIL: krishna.byf@gmail.com
    SQS_QUEUE_NAME: messaging-queue

  iam:
    role:
      statements:
        # ✅ SES Permissions
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"

        # ✅ SNS Permissions (for SMS)
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: "*"

        # ✅ SQS Permissions
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueUrl
          Resource: "*"

functions:
  sendEmail:
    handler: handler.send_email
    events:
      - http:
          path: email
          method: post

  sendSMS:
    handler: handler.send_sms
    events:
      - http:
          path: sms
          method: post

  # 🔥 Future SQS Processor (optional now, ready for upgrade)
  queueProcessor:
    handler: handler.process_queue
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - MessagingQueue
              - Arn

resources:
  Resources:
    MessagingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: messaging-queue